<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device_width, initial-scale=1"/>
        <title>The Social Game - Dashboard</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="has_nav_bar">
            <aside class="nav_bar">
                <a href="accueil.html">
                    <img src="../ressources/logo_header.png" alt="The Social Game">
                </a>
                <nav class="nav_buttons">
                    <a class="nav_button_active" href="dashboard.html">
                        <img src="../ressources/world.png" alt="world"> Tableau de bord
                    </a>    
                    <a class="nav_button" href="evenements.html">
                        <img src="../ressources/calendar-alt.png" alt="calendar-alt">
                        Évenements
                    </a>    
                    <a class="nav_button" href="amis.html">
                        <img src="../ressources/users.png" alt="users">
                        Amis
                    </a>    
                    <a class="nav_button" href="profil.html">
                        <img src="../ressources/user-circle.png" alt="user-circle">
                        Profil
                    </a>
                </nav>
            </aside>
            <main class="content">
                <div class="head"><h1>Tableau de bord</h1></div>
                <section class="points_panel">
                    <box class="widget_box">
                        <img src="../ressources/Trophy.png" alt="trophy">
                    </box>
                    <h2 class="panel_title">Points gagnés cette semaine</h2>
                    <p class="points"><b>7 Points</b></p>
                    <p class="subscript">Cumul des missions complétées</p>
                </section>
                <section class="mission_panel">
                    <box class="widget_box">
                        <img src="../ressources/Task list.png" alt="task list">
                    </box>
                    <h2 class="panel_title">Missions hebdomadaires</h2>
                    <div class="week_overview">
                        <p><b>2-8 Novembre, 2026</b></p>
                        <p class="subscript">Cette semaine - Semaine 45</p>
                    </div>
                    <div class="week_progress">
                        <p class="subscript">3 sur 8 complétées</p>
                        <p><b>38%</b></p>
                    </div>
                    <p class="subscript">Missions</p>
                    <div class="mission_list">
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 1</p>
                            <p class="mission_points">2 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 2</p>
                            <p class="mission_points">2 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 3</p>
                            <p class="mission_points">3 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 4</p>
                            <p class="mission_points">4 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 5</p>
                            <p class="mission_points">4 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 6</p>
                            <p class="mission_points">5 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 7</p>
                            <p class="mission_points">5 points</p>
                        </label>
                        <label class="mission_box">
                            <input type="checkbox">
                            <p class="mission">Mission 8</p>
                            <p class="mission_points">5 points</p>
                        </label>                       
                    </div>
                    <p>5 missions restantes</p>
                </section>
            </main>
        </div>
        <footer class="site_footer">
            <p>The Social Game</p>
            <a href="a_propos">A propos</p>
        </footer>
    </body>
</html>
