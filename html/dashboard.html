<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>The Social Game - Dashboard</title>
        <link rel="stylesheet" href="../css/style.css">
        <script src="../js/recompenses.js" defer></script>
        <script src="../js/dashboard.js" defer></script>
    </head>
    <body>
        <div class="has_nav_bar">
            <aside class="nav_bar">
                <a href="accueil.html">
                    <img src="../ressources/logo_header.png" alt="The Social Game">
                </a>
                <nav class="nav_buttons">
                    <a class="nav_button_active" href="dashboard.html">
                        <img src="../ressources/world.png" alt="world"> Tableau de bord
                    </a>    
                    <a class="nav_button" href="evenements.html">
                        <img src="../ressources/calendar-alt.png" alt="calendar-alt">
                        Événements
                    </a>    
                    <a class="nav_button" href="amis.html">
                        <img src="../ressources/users.png" alt="users">
                        Amis
                    </a>    
                    <a class="nav_button" href="profil.html">
                        <img src="../ressources/user-circle.png" alt="user-circle">
                        Profil
                    </a>
                </nav>
            </aside>
            <main class="content">
                <div class="head"><h1>Tableau de bord</h1></div>
                <section class="points_panel">
                    <div class="widget_box">
                        <img src="../ressources/Trophy.png" alt="trophy">
                    </div>
                    <h2 class="panel_title">Points gagnés cette semaine</h2>
                    <p class="points"><b><span id="points-semaine">0</span> Points</b></p>
                    <p class="subscript">Cumul des missions complétées</p>
                </section>
                <section class="mission_panel">
                    <div class="widget_box">
                        <img src="../ressources/Task_list.png" alt="task list">
                    </div>
                    <h2 class="panel_title">Missions hebdomadaires</h2>
                    <div class="week_overview">
                        <div class="current_week">
                            <p><b>16-22 Novembre, 2026</b></p>
                            <p class="subscript">Cette semaine - Semaine 47</p>
                        </div>
                        <p class="week_progress">
                            <label for="progression">
                                <span id="missions-completees">0</span> sur <span id="nombre-missions">8</span> complétées
                            </label>
                            <progress id="progression" value="0" max="8" style="accent-color: var(--yellow)"></progress>
                            <span id="pourcentage">0</span> %
                        </p>
                    </div>
                    <p class="subscript">Missions</p>
                    <ul class="mission_list" id="liste-missions" data-semaine="2026-47">
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-1" data-points="2">
                                <span class="mission">Envoyer un message à un ami perdu de vue</span>
                                <span class="mission_points">2 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-2" data-points="2">
                                <span class="mission">Faire un compliment sincère à quelqu'un</span>
                                <span class="mission_points">2 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-3" data-points="3">
                                <span class="mission">Engager une conversation avec une nouvelle personne</span>
                                <span class="mission_points">3 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-4" data-points="4">
                                <span class="mission">Proposer une sortie à un ami</span>
                                <span class="mission_points">4 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-5" data-points="4">
                                <span class="mission">Aider quelqu'un dans une tâche</span>
                                <span class="mission_points">4 points</span>
                            </label>
                        </li>
                        <li>    
                            <label class="mission_box">
                                <input type="checkbox" id="mission-6" data-points="5">
                                <span class="mission">Prendre un café avec une nouvelle connaissance</span>
                                <span class="mission_points">5 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-7" data-points="5">
                                <span class="mission">Participer à une activité de groupe</span>
                                <span class="mission_points">5 points</span>
                            </label>
                        </li>
                        <li>
                            <label class="mission_box">
                                <input type="checkbox" id="mission-8" data-points="5">
                                <span class="mission">Organiser une rencontre entre amis</span>
                                <span class="mission_points">5 points</span>
                            </label>
                        </li>                       
                    </ul>
                    <p><span id="missions-restantes">8</span> missions restantes</p>
                </section>
            </main>
        </div>
        <footer class="site_footer">
            <p>The Social Game</p>
            <a href="a_propos.html">À propos</a>
        </footer>
    </body>
</html>
