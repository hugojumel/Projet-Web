<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device_width, initial-scale=1"/>
        <title>The Social Game - Profil</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="has_nav_bar">
            <aside class="nav_bar">
                <a href="accueil.html">
                    <img src="../ressources/logo_header.png" alt="The Social Game">
                </a>
                <nav class="nav_buttons">
                    <a class="nav_button" href="dashboard.html">
                        <img src="../ressources/world.png" alt="world"> Tableau de bord
                    </a>    
                    <a class="nav_button" href="evenements.html">
                        <img src="../ressources/calendar-alt.png" alt="calendar-alt">
                        Événements
                    </a>    
                    <a class="nav_button" href="amis.html">
                        <img src="../ressources/users.png" alt="users">
                        Amis
                    </a>    
                    <a class="nav_button_active" href="profil.html">
                        <img src="../ressources/user-circle.png" alt="user-circle">
                        Profil
                    </a>
                </nav>
            </aside>
            <main class="content">
                <div class="profile">
                    <div class="info_profile">
                        <h1>Alex Mercier</h1>
                        <p>Niveau 12</p>
                    </div>
                    <button class="edit_button" type="button">
                    <img src="../ressources/pencil.png" alt="pencil">
                    Modifier
                    </button>
                </div>
                <section class="progress">
                    <div class="progress_heading">
                        <h4>Level 12 Progress</h4>
                        <img src="../ressources/check.png" alt="check">
                    </div>
                    <div class="progress_track">
                        <p>250 XP du prochain niveau</p>
                    </div>
                </section>
                <section class="stats">
                    <article class="stat">
                        <img src="../ressources/trophy-sharp.png">
                        <div class="stat_content">
                            <p>Total XP</p>
                            <h4>1,250</h4>
                        </div>
                    </article>
                    <article class="stat">
                        <img src="../ressources/calendar2-check-fill.png">
                        <div class="stat_content">
                            <p>Missions réalisées</p>
                            <h4>12</h4>
                            <p>pendant ce mois</p>
                        </div>
                    </article>
                    <article class="stat">
                        <img src="../ressources/list-check.png">
                        <div class="stat_content">
                            <p>Total de missions</p>
                            <h4>25</h4>
                        </div>
                    </article>
                </section>
                <section class="recent_missions">
                    <h2>Mission Récentes</h2>
                    <ul style="list-style-type: none;">
                        <li><img src="../ressources/check_green.png" alt="check_green">Mission 3</li>
                        <li><img src="../ressources/check_green.png" alt="check_green">Mission 2</li>
                        <li><img src="../ressources/check_green.png" alt="check_green">Mission 1</li>
                    </ul>
                </section>
            </main>
        </div>
        <footer class="site_footer">
            <p>The Social Game</p>
            <a href="a_propos.html">A propos</p>
        </footer>
    </body>
</html>
